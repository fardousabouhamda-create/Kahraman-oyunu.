    <!-- تحميل Tailwind CSS عبر CDN لتصميم حديث ومستجيب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تحميل Lucide Icons كـ SVG -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        /* أنماط مخصصة لتأثير قلب البطاقة في وضع التعلم */
        .perspective-1000 {
            perspective: 1000px;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        
        /* تأثيرات الحركة */
        @keyframes bounce-in {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-bounce-in {
            animation: bounce-in 0.5s ease-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>
</head>

    function speak(text, lang = 'tr-TR') {
        // وظيفة تحويل النص إلى كلام (TTS)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }
    }

    function shuffleArray(array) {
        // خوارزمية لخلط عناصر المصفوفة (Fisher-Yates)
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

        // إنشاء أيقونات Lucide
        return `<i data-lucide="${iconName}" class="${className}"></i>`;

    // --- وضع التعلم (Learn Mode) ---

    function handleLearnFlip() {
        // قلب البطاقة وعرض الترجمة
        updateState({ isFlipped: !state.isFlipped });
        if (!state.isFlipped) {
            // نطق الكلمة عند قلبها للجهة التركية
            speak(state.selectedCategory.words[state.currentIndex].tr);
        }
    }

    function handleLearnNavigation(direction) {
        // التنقل بين الكلمات
        const words = state.selectedCategory.words;
        const newIndex = (state.currentIndex + direction + words.length) % words.length;
        updateState({ currentIndex: newIndex, isFlipped: false });
    }

    function renderLearnMode() {
        const category = state.selectedCategory;
        const currentWord = category.words[state.currentIndex];

    // --- وضع الاختبار (Quiz Mode) ---

    function setupQuiz() {
        // إعداد سؤال جديد وخلط الخيارات
        const category = state.selectedCategory;
        const currentWord = category.words[state.currentIndex];

        if (!currentWord) return updateState({ quizFeedback: 'finished' });

        // نختار 3 خيارات خاطئة عشوائية
        const others = category.words.filter(w => w.id !== currentWord.id);
        const shuffledOthers = shuffleArray([...others]).slice(0, 3);
        const allOptions = shuffleArray([currentWord, ...shuffledOthers]);
        
        updateState({ quizOptions: allOptions, quizFeedback: null });
        speak(currentWord.tr); // نطق الكلمة التركية للسؤال
    }

    function handleQuizAnswer(selectedId) {
        // معالجة إجابة المستخدم
        if (state.quizFeedback) return;

        const currentWord = state.selectedCategory.words[state.currentIndex];

        if (selectedId === currentWord.id) {
            // إجابة صحيحة
            updateState({ quizFeedback: 'correct', score: state.score + 10, quizLocalScore: state.quizLocalScore + 1 });
            speak('Harika'); // نطق عبارة تشجيعية بالتركية
            setTimeout(() => {
                if (state.currentIndex < state.selectedCategory.words.length - 1) {
                    // الانتقال للسؤال التالي
                    updateState({ currentIndex: state.currentIndex + 1 });
                    setupQuiz(); 
                } else {
                    // نهاية الاختبار
                    updateState({ quizFeedback: 'finished' });
                }
            }, 1500);
        } else {
            // إجابة خاطئة
            updateState({ quizFeedback: 'wrong' });
            speak('Tekrar dene');
            setTimeout(() => {
                // إزالة رسالة الخطأ بعد فترة قصيرة
                updateState({ quizFeedback: null });
            }, 1000);
        }
    }

    function renderQuizMode() {
        const category = state.selectedCategory;
        
        if (state.quizFeedback === 'finished') {
            // شاشة نتائج الاختبار
            contentArea.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center animate-bounce-in">
                    <div class="text-9xl mb-4">🏆</div>
                    <h2 class="text-4xl font-black text-yellow-500 mb-4">أحسنت يا بطل!</h2>
                    <p class="text-xl text-gray-600 mb-2">لقد أنهيت اختبار ${category.title} بنجاح.</p>
                    <p class="text-2xl font-bold text-blue-600 mb-8">أحرزت ${state.quizLocalScore} من ${category.words.length} نقاط</p>
                    <button onclick="goBackToCategorySelect()" class="bg-green-500 text-white py-3 px-8 rounded-2xl text-xl font-bold shadow-lg hover:scale-105 transition">اختر قسماً آخر</button>
                </div>
            `;
            return;
        }
        
        const currentWord = category.words[state.currentIndex];
        
        if (!currentWord || state.quizOptions.length === 0) {
            // تحميل السؤال الأول
            contentArea.innerHTML = `<div class="text-center pt-20 text-xl text-gray-500">جاري تحميل السؤال...</div>`;
            return setupQuiz(); 
        }

        const progressPercent = ((state.currentIndex) / category.words.length) * 100;

        const optionsHTML = state.quizOptions.map(opt => `
            <button
                onclick="handleQuizAnswer(${opt.id})"
                ${state.quizFeedback ? 'disabled' : ''}
                class="
                    p-6 rounded-3xl shadow-md text-6xl transition-all transform hover:scale-105 border-4
                    ${state.quizFeedback === 'correct' && opt.id === currentWord.id ? 'bg-green-100 border-green-500 scale-105' : ''}
                    ${state.quizFeedback === 'wrong' && opt.id === currentWord.id ? 'bg-green-100 border-green-500' : ''} 
                    ${state.quizFeedback === 'wrong' && opt.id !== currentWord.id ? 'opacity-50' : ''}
                    ${!state.quizFeedback ? 'bg-white border-transparent hover:border-blue-300' : ''}
                "
            >
                ${opt.emoji}
            </button>
        `).join('');

        let feedbackHTML = '';
        if (state.quizFeedback === 'correct') {
            feedbackHTML = `<div class="mt-6 text-2xl font-black text-green-500 animate-bounce-in">إجابة صحيحة! 🎉</div>`;
        } else if (state.quizFeedback === 'wrong') {
            feedbackHTML = `<div class="mt-6 text-2xl font-black text-red-500 animate-shake">حاول مرة أخرى 😅</div>`;
        }


        contentArea.innerHTML = `
            <div class="flex flex-col items-center h-full max-w-2xl mx-auto pt-4">
                <!-- شريط التقدم -->
                <div class="w-full bg-gray-200 rounded-full h-4 mb-8">
                    <div 
                        class="bg-blue-500 h-4 rounded-full transition-all duration-500" 
                        style="width: ${progressPercent}%"
                    ></div>
                </div>

                <!-- السؤال -->
                <div class="text-center mb-8">
                    <h2 class="text-2xl text-gray-500 mb-2">أين هو؟</h2>
                    <h1 class="text-5xl font-black text-blue-600 mb-4 cursor-pointer hover:scale-105 transition" onclick="speak('${currentWord.tr}')">
                        ${currentWord.tr}
                        ${createIcon('volume-2', 'inline mr-3 w-8 h-8 text-blue-400')}
                    </h1>
                </div>

                <!-- شبكة الخيارات -->
                <div class="grid grid-cols-2 gap-4 w-full">
                    ${optionsHTML}
                </div>
                
                <!-- التغذية الراجعة (Feedback) -->
                ${feedbackHTML}

                 <button onclick="goBackToCategorySelect()" class="mt-6 text-sm text-gray-500 hover:text-gray-800 transition-colors flex items-center gap-1">
                    ${createIcon('arrow-right', 'w-4 h-4')} العودة لاختيار القسم
                </button>
            </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }


    // --- وضع الذاكرة (Memory Mode) ---

    function setupMemory() {
        // إعداد بطاقات الذاكرة (8 كلمات = 16 بطاقة)
        const category = state.selectedCategory;
        const wordsToUse = category.words.slice(0, 8); 

        const initialCards = [];
        wordsToUse.forEach(w => {
            // بطاقة للكلمة التركية
            initialCards.push({ id: w.id, content: w.tr, type: 'text', uniqueId: `${w.id}-text` });
            // بطاقة للرمز التعبيري
            initialCards.push({ id: w.id, content: w.emoji, type: 'emoji', uniqueId: `${w.id}-emoji` });
        });
        
        updateState({
            memoryCards: shuffleArray(initialCards),
            flippedCards: [],
            solvedCards: [],
            isDisabled: false
        });
    }

    function handleMemoryClick(uniqueId) {
        // معالجة النقر على بطاقة في وضع الذاكرة
        if (state.isDisabled || state.solvedCards.includes(uniqueId) || state.flippedCards.includes(uniqueId)) return;

        const clickedCard = state.memoryCards.find(c => c.uniqueId === uniqueId);

        if (state.flippedCards.length === 0) {
            // قلب البطاقة الأولى
            if (clickedCard.type === 'text') speak(clickedCard.content);
            updateState({ flippedCards: [uniqueId] });
            return;
        }

        // قلب البطاقة الثانية
        const newFlipped = [state.flippedCards[0], uniqueId];
        updateState({ flippedCards: newFlipped, isDisabled: true });
        if (clickedCard.type === 'text') speak(clickedCard.content);


        const firstCard = state.memoryCards.find(c => c.uniqueId === newFlipped[0]);
        const secondCard = clickedCard; 

        if (firstCard.id === secondCard.id) {
            // تطابق ناجح
            updateState({ 
                solvedCards: [...state.solvedCards, firstCard.uniqueId, secondCard.uniqueId],
                flippedCards: [],
                isDisabled: false,
                score: state.score + 20
            });
            speak('Süper');
        } else {
            // عدم تطابق
            setTimeout(() => {
                // إغلاق البطاقتين بعد ثانية
                updateState({ flippedCards: [], isDisabled: false });
            }, 1000);
        }
    }

    function renderMemoryMode() {
        if (state.memoryCards.length === 0) {
            setupMemory(); // إعداد اللعبة لأول مرة
            return; 
        }

        const isCompleted = state.memoryCards.length > 0 && state.solvedCards.length === state.memoryCards.length;

        if (isCompleted) {
            // شاشة اكتمال اللعبة
            contentArea.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center animate-bounce-in">
                    <div class="text-9xl mb-4">🌟</div>
                    <h2 class="text-4xl font-black text-purple-600 mb-4">ذاكرة فولاذية!</h2>
                    <button onclick="goBackToCategorySelect()" class="bg-purple-500 text-white py-3 px-8 rounded-2xl text-xl font-bold shadow-lg hover:bg-purple-600 transition">العودة للقائمة</button>
                </div>
            `;
            return;
        }

        const cardsHTML = state.memoryCards.map(card => {
            const isFlippedNow = state.flippedCards.includes(card.uniqueId) || state.solvedCards.includes(card.uniqueId);
            
            return `
                <div
                    onclick="handleMemoryClick('${card.uniqueId}')"
                    class="
                        aspect-square rounded-xl flex items-center justify-center text-xl font-black cursor-pointer transition-all duration-300 transform shadow-md
                        ${isFlippedNow 
                            ? `${card.type === 'text' ? 'bg-blue-500 text-white' : 'bg-white'} rotate-0` 
                            : 'bg-gray-300 text-transparent hover:bg-gray-400'}
                        ${state.solvedCards.includes(card.uniqueId) ? 'shadow-green-500/50 shadow-xl scale-105' : ''}
                    "
                    style="pointer-events: ${state.solvedCards.includes(card.uniqueId) || state.isDisabled ? 'none' : 'auto'};"
                >
                    <div class="${card.type === 'emoji' ? 'text-5xl' : 'text-xl'}">
                        ${isFlippedNow ? card.content : createIcon('aperture', 'w-10 h-10 text-white')}
                    </div>
                </div>
            `;
        }).join('');

        contentArea.innerHTML = `
            <div class="h-full flex flex-col items-center">
                <h2 class="text-2xl font-black text-gray-600 mb-4">طابق الكلمة التركية مع الرمز (4x4)</h2>
                <div class="grid grid-cols-4 gap-3 w-full max-w-lg mx-auto">
                    ${cardsHTML}
                </div>
                <button onclick="goBackToCategorySelect()" class="mt-6 text-sm text-gray-500 hover:text-gray-800 transition-colors flex items-center gap-1">
                    ${createIcon('arrow-right', 'w-4 h-4')} العودة لاختيار القسم
                </button>
            </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }


    // --- وظيفة العرض الرئيسية (Main Render Function) ---
    function renderApp() {
        renderHeader();
        contentArea.innerHTML = ''; 

        switch (state.view) {
            case 'home':
                renderHome();
                break;
            case 'category-select':
                renderCategorySelect();
                break;
            case 'learn':
                if (state.selectedCategory) renderLearnMode();
                else updateState({ view: 'category-select' });
                break;
            case 'quiz':
                if (state.selectedCategory) renderQuizMode();
                else updateState({ view: 'category-select' });
                break;
            case 'memory':
                if (state.selectedCategory) renderMemoryMode();
                else updateState({ view: 'category-select' });
                break;
        }
    }

    // تهيئة التطبيق عند تحميل الصفحة
    window.onload = renderApp;
</script>

</body>
</html>
